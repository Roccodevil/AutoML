<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic AI Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1e1e1e; color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #2d2d2d; border: 1px solid #444; border-radius: 15px; transition: transform 0.3s; color: white; }
        .card:hover { transform: translateY(-10px); border-color: #0d6efd; }
        .icon-box { font-size: 40px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-5 display-4 fw-bold">🚀 Agentic AI Studio</h1>
        <div class="row justify-content-center g-4">
            <div class="col-md-5">
                <div class="card h-100 p-5">
                    <div class="icon-box text-primary">📊</div>
                    <h2>AutoML Engine</h2>
                    <p class="text-secondary">Tabular Data • H2O.ai • Regression & Classification</p>
                    <a href="/automl" class="btn btn-primary btn-lg mt-3 w-100">Launch AutoML</a>
                </div>
            </div>
            <div class="col-md-5">
                <div class="card h-100 p-5">
                    <div class="icon-box text-success">🧠</div>
                    <h2>AutoNLP Engine</h2>
                    <p class="text-secondary">Text Data • Sentiment Analysis • Tokenization</p>
                    <a href="/autonlp" class="btn btn-success btn-lg mt-3 w-100">Launch NLP</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
